name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew test --stacktrace

      - name: Revisar esquema exportado de la base de datos
        run: |
          # Room exporta el esquema al compilar; si cambió y no está en git, se muestra aquí para versionarlo.
          changes=$(git status --porcelain core/database/schemas)
          if [ -n "$changes" ]; then
            echo "::warning::Esquema de base de datos sin versionar"
            echo "$changes"
            for f in $(git ls-files --others --modified core/database/schemas); do echo "=== $f"; cat "$f"; done
          fi

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publicar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: "**/build/reports/tests/"
